name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly re-scan to catch newly disclosed CVEs in pinned deps.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for gitleaks

      - uses: actions/setup-go@v7
        with:
          # Deliberately NOT go-version-file: go.mod. The go directive pins a
          # full patch release, and stdlib CVEs land against it faster than we
          # can bump — which turned this weekly scan red for two months over
          # advisories already fixed upstream. Scanning under the newest release
          # keeps the gate about our code. The pinned toolchain still gets
          # checked: ci.yml runs govulncheck against go.mod as a soft warning.
          go-version: stable

      - name: Install tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # The /v2 suffix matters: @latest on the old path caps out at v1.9.2
          # (Dec 2024), which is what this job silently ran for 20 months.
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          go install github.com/zricethezav/gitleaks/v8@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: staticcheck ./...

      - name: gosec
        # G304/G204 excluded: intentional file-scanner + subprocess design; see docs/threat-model.md
        run: gosec -exclude-dir=testdata -exclude=G304,G204 ./...

      - name: govulncheck
        run: govulncheck ./...

      - name: osv-scanner
        # stdlib is ignored via osv-scanner.toml — govulncheck above owns it.
        run: osv-scanner scan source --lockfile=go.mod --config=osv-scanner.toml

      - name: gitleaks
        run: gitleaks detect --source=. --redact --log-opts="--all"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
