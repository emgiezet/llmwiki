name: release-please

on:
  push:
    branches: [main]
  # Allow manual re-trigger from the Actions tab — useful when a run failed
  # due to a one-time repo setting (e.g. "Allow GitHub Actions to create
  # pull requests") that wasn't enabled yet.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: go
          # release-please maintains a single "Release PR" that accumulates
          # conventional-commit history (feat:, fix:, feat!:/BREAKING CHANGE:).
          # Merging that PR creates a vX.Y.Z tag + GitHub Release; the
          # goreleaser job below runs in the same workflow to attach binaries.
          # (A tag push made by GITHUB_TOKEN does NOT trigger other workflows,
          # so the standalone release.yml never fires for release-please tags —
          # we chain here instead.)

  goreleaser:
    name: Build and publish release binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      packages: write # push container images to GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go test -race ./...

      # Needed for the multi-arch (linux/amd64 + linux/arm64) container builds.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on emgiezet/homebrew-tap. If the secret is
          # absent the brews step errors; create the tap repo + secret first.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  npm-publish:
    name: Publish npm wrapper
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      # Exposed at job level so the publish step's `if` can test for it.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Test wrapper
        working-directory: npm
        run: node --test test/*.test.js
      - name: Publish to npm (skipped when NPM_TOKEN is unset)
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: npm
        run: |
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
