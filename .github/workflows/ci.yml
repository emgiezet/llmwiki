name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel stale runs on the same ref when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race detector)
        run: go test -race ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: govulncheck (soft — warn only)
        # This runs under the toolchain pinned in go.mod, so it is where an aging
        # pin shows up. Soft on purpose: a fresh stdlib CVE should warn on the
        # next PR, not block unrelated work. The hard gate in security.yml scans
        # under the newest Go release instead.
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  npm-wrapper:
    name: npm wrapper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test npm wrapper (dependency-free, node:test)
        working-directory: npm
        run: node --test "test/*.test.js"
