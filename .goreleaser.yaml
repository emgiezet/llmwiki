# Goreleaser v2 config for llmwiki.
# Reference: https://goreleaser.com/customization/
version: 2

project_name: llmwiki

before:
  hooks:
    - go mod tidy

builds:
  - id: llmwiki
    main: ./
    binary: llmwiki
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/emgiezet/llmwiki/internal/version.Version={{.Version}}
      - -X github.com/emgiezet/llmwiki/internal/version.Commit={{.ShortCommit}}
      - -X github.com/emgiezet/llmwiki/internal/version.Date={{.Date}}

archives:
  - id: default
    ids: [llmwiki]
    # install.sh expects: llmwiki_<version>_<os>_<arch>.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE*
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Multi-arch container images published to GitHub Container Registry.
# dockers_v2 builds linux/amd64 + linux/arm64 in one buildx pass and pushes a
# single multi-arch manifest per tag (:<version> and :latest). The Dockerfile
# copies from $TARGETPLATFORM/llmwiki — goreleaser lays the per-platform
# binaries out under that path in the build context.
dockers_v2:
  - id: llmwiki
    ids: [llmwiki]
    dockerfile: Dockerfile.goreleaser
    images:
      - "ghcr.io/emgiezet/llmwiki"
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      # latest only for stable releases, never rc/beta prereleases.
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Turn any codebase into a living, LLM-maintained wiki"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/emgiezet/llmwiki"
      org.opencontainers.image.licenses: "MIT"

# Homebrew formula auto-committed to the emgiezet/homebrew-tap repo on each
# release. Requires a HOMEBREW_TAP_TOKEN secret (PAT with `contents:write` on
# the tap repo) — GITHUB_TOKEN cannot push to a different repository.
brews:
  - name: llmwiki
    ids: [default]
    repository:
      owner: emgiezet
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/emgiezet/llmwiki"
    description: "Turn any codebase into a living, LLM-maintained wiki"
    license: "MIT"
    commit_author:
      name: goreleaser-bot
      email: goreleaser-bot@users.noreply.github.com
    # Don't auto-publish formulas for prereleases (rc/beta tags).
    skip_upload: auto
    install: |
      bin.install "llmwiki"
    test: |
      system "#{bin}/llmwiki", "version"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # release-please maintains CHANGELOG.md; we skip goreleaser's generated
  # changelog to avoid a second source of truth.
  disable: true

release:
  # release-please creates the GitHub Release already; goreleaser attaches
  # assets to it.
  draft: false
  prerelease: auto
  # Ship install.sh alongside each release so users who want a version-pinned
  # installer (reproducible builds) can curl the per-release asset instead of
  # the one on main.
  extra_files:
    - glob: ./install.sh
