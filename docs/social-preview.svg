<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .mono { font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="14" height="640" fill="#58a6ff"/>

  <!-- wordmark -->
  <text x="80" y="190" font-size="104" font-weight="800" fill="#f0f6fc">llmwiki</text>

  <!-- tagline -->
  <text x="84" y="258" font-size="38" fill="#c9d1d9">Turn any codebase into a living, LLM-maintained wiki.</text>
  <text x="84" y="306" font-size="27" fill="#8b949e">Persistent, self-maintaining project knowledge — for you and your AI agents.</text>

  <!-- feature row -->
  <text x="84"  y="392" font-size="27" fill="#3fb950">◆</text>
  <text x="118" y="392" font-size="27" fill="#c9d1d9">MCP server for agents</text>
  <text x="430" y="392" font-size="27" fill="#3fb950">◆</text>
  <text x="464" y="392" font-size="27" fill="#c9d1d9">Mermaid diagrams</text>
  <text x="730" y="392" font-size="27" fill="#3fb950">◆</text>
  <text x="764" y="392" font-size="27" fill="#c9d1d9">Staleness detection</text>

  <text x="84"  y="442" font-size="27" fill="#3fb950">◆</text>
  <text x="118" y="442" font-size="27" fill="#c9d1d9">Local-first markdown — no SaaS</text>
  <text x="560" y="442" font-size="27" fill="#3fb950">◆</text>
  <text x="594" y="442" font-size="27" fill="#c9d1d9">Runs offline on Ollama (NDA-safe)</text>

  <!-- install chips -->
  <rect x="84"  y="498" width="232" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="104" y="532" class="mono" font-size="24" fill="#58a6ff">npx llmwiki</text>
  <rect x="336" y="498" width="370" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="356" y="532" class="mono" font-size="24" fill="#58a6ff">brew install emgiezet/tap/llmwiki</text>
  <rect x="726" y="498" width="118" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="746" y="532" class="mono" font-size="24" fill="#58a6ff">docker</text>

  <!-- footer -->
  <text x="84"   y="600" class="mono" font-size="22" fill="#8b949e">github.com/emgiezet/llmwiki</text>
  <text x="1196" y="600" class="mono" font-size="22" fill="#8b949e" text-anchor="end">MIT</text>
</svg>
