# osv-scanner has no reachability analysis: it matches advisories against the
# `go` directive in go.mod, so every new Go patch release makes it report stdlib
# CVEs regardless of whether our code can reach them. govulncheck runs in the
# same job and does do call-graph reachability, so it owns the standard library.
# Leaving stdlib on here only produced duplicate findings that failed the scan
# for advisories already patched upstream.
#
# Third-party modules are still scanned normally — that is what osv-scanner is
# here for. See docs/supply-chain.md, "Mitigation — current stdlib policy".
[[PackageOverrides]]
name = "stdlib"
ecosystem = "Go"
ignore = true
reason = "Go stdlib is gated by govulncheck (reachability-aware) in the same job"
