name: release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.2.0)"
        required: true

permissions:
  contents: write # upload release assets
  packages: write # push container images to GHCR

jobs:
  test:
    name: Verify tests pass before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...

  goreleaser:
    name: Build and publish release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs full history for changelog links
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set GORELEASER_CURRENT_TAG for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "GORELEASER_CURRENT_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV

      # Needed for the multi-arch (linux/amd64 + linux/arm64) container builds.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on emgiezet/homebrew-tap. If the secret is
          # absent the brews step errors; create the tap repo + secret first.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  npm-publish:
    name: Publish npm wrapper
    needs: test
    runs-on: ubuntu-latest
    env:
      # Exposed at job level so the publish step's `if` can test for it.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Test wrapper
        working-directory: npm
        run: node --test "test/*.test.js"
      - name: Publish to npm (skipped when NPM_TOKEN is unset)
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: npm
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
